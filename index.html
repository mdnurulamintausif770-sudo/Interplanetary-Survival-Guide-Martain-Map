  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="Tausif Interplanetary Survival Guide: Martian Map" />
    <meta property="og:description" content="NASA Space Apps Challenge 2026 prototype by Quanta Buddies: Advanced AI-powered Martian Map, GIS layers, A* rover/EVA pathfinding, RAG mission assistant, and hazard detection." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress benign WebSocket/HMR disconnection logs in sandboxed iframe environment
      const isWebSocketNoise = (args) => {
        const msg = args.map((a) => {
          try {
            return typeof a === 'object' ? JSON.stringify(a) : String(a);
          } catch (e) {
            return String(a);
          }
        }).join(' ').toLowerCase();

        return (
          msg.includes('websocket') ||
          msg.includes('[vite] failed to connect') ||
          msg.includes('closed without opened') ||
          msg.includes('failed to connect to websocket')
        );
      };

      const origError = console.error;
      console.error = function (...args) {
        if (isWebSocketNoise(args)) return;
        origError.apply(console, args);
      };

      const origWarn = console.warn;
      console.warn = function (...args) {
        if (isWebSocketNoise(args)) return;
        if (args.some((a) => String(a).includes('THREE.Clock: This module has been deprecated'))) return;
        origWarn.apply(console, args);
      };

      const origLog = console.log;
      console.log = function (...args) {
        if (isWebSocketNoise(args)) return;
        origLog.apply(console, args);
      };

      const origDebug = console.debug;
      console.debug = function (...args) {
        if (isWebSocketNoise(args)) return;
        origDebug.apply(console, args);
      };

      window.addEventListener('unhandledrejection', function (event) {
        try {
          var str = String((event && event.reason && (event.reason.message || event.reason)) || '').toLowerCase();
          if (
            str.includes('websocket') ||
            str.includes('closed without opened') ||
            str.includes('failed to connect')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        } catch (e) {}
      }, true);

      window.addEventListener('error', function (event) {
        try {
          var str = String((event && (event.message || (event.error && event.error.message))) || '').toLowerCase();
          if (
            str.includes('websocket') ||
            str.includes('closed without opened') ||
            str.includes('failed to connect')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        } catch (e) {}
      }, true);
    </script>
  </head>
  <body class="bg-[#080B10] text-slate-100 antialiased selection:bg-red-500/30 selection:text-red-200 overflow-x-hidden min-h-[100dvh]">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
